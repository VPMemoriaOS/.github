name: Documentation lint (reusable)

# Shared documentation check for VPMemoriaOS repositories.
# Lints Markdown files changed in the pull request with Vale (prose)
# and markdownlint-cli2 (structure). Uses the caller's own .vale.ini /
# .markdownlint-cli2.yaml when present, otherwise the shared config
# from this repository.

on:
  workflow_call:
    inputs:
      runs-on:
        description: JSON runner selector, e.g. '"ubuntu-latest"' or '["self-hosted","linux"]'.
        type: string
        default: '"ubuntu-latest"'
      config-ref:
        description: Ref of VPMemoriaOS/.github to take the shared config from.
        type: string
        default: main

permissions:
  contents: read

env:
  VALE_VERSION: 3.25.1
  MARKDOWNLINT_CLI2_VERSION: 0.24.0

jobs:
  lint:
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch shared config
        uses: actions/checkout@v7
        with:
          repository: VPMemoriaOS/.github
          ref: ${{ inputs.config-ref }}
          path: .org-docs
          persist-credentials: false
          sparse-checkout: |
            .vale.ini
            .vale
            .markdownlint-cli2.yaml

      - name: Find changed Markdown files
        id: files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$BASE_SHA" ]; then
            git diff --name-only --diff-filter=ACMR "$BASE_SHA"...HEAD -- '*.md' > "$RUNNER_TEMP/files.txt"
          else
            git ls-files '*.md' > "$RUNNER_TEMP/files.txt"
          fi
          echo "Changed Markdown files:"; cat "$RUNNER_TEMP/files.txt"
          echo "count=$(wc -l < "$RUNNER_TEMP/files.txt")" >> "$GITHUB_OUTPUT"

      - name: Install Vale
        if: steps.files.outputs.count != '0'
        run: |
          curl -fsSL "https://github.com/errata-ai/vale/releases/download/v${VALE_VERSION}/vale_${VALE_VERSION}_Linux_64-bit.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP" vale
          "$RUNNER_TEMP/vale" --version

      - name: Vale
        if: steps.files.outputs.count != '0'
        run: |
          cfg=.vale.ini; [ -f "$cfg" ] || cfg=.org-docs/.vale.ini
          echo "Using $cfg"
          xargs -d '\n' -a "$RUNNER_TEMP/files.txt" "$RUNNER_TEMP/vale" --config "$cfg" --output JSON \
            > "$RUNNER_TEMP/vale.json" || true
          python3 - "$RUNNER_TEMP/vale.json" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1]))
          errors = 0
          for path, alerts in data.items():
              for a in alerts:
                  level = {"error": "error", "warning": "warning"}.get(a["Severity"], "notice")
                  errors += level == "error"
                  print(f"::{level} file={path},line={a['Line']},col={a['Span'][0]},title={a['Check']}::{a['Message']}")
          print(f"Vale: {errors} error(s)")
          sys.exit(1 if errors else 0)
          PY

      - uses: actions/setup-node@v7
        if: steps.files.outputs.count != '0'
        with:
          node-version: 22

      - name: markdownlint
        if: steps.files.outputs.count != '0'
        run: |
          cfg=.markdownlint-cli2.yaml; [ -f "$cfg" ] || cfg=.org-docs/.markdownlint-cli2.yaml
          echo "Using $cfg"
          xargs -d '\n' -a "$RUNNER_TEMP/files.txt" \
            npx --yes "markdownlint-cli2@${MARKDOWNLINT_CLI2_VERSION}" --config "$cfg"
