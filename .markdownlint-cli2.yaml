config:
  default: true
  MD013: false   # line length: prose is not wrapped
  MD033: false   # inline HTML is allowed
  MD024:         # duplicate headings only among siblings (changelog sections repeat per version)
    siblings_only: true
  MD041: false   # first line need not be a heading (e.g. issue forms, includes)
  MD060: false   # table column alignment: compact tables are fine
